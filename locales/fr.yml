commands:
    play:
        name: 'play'
        description: 'Joue une chanson par nom ou URL'
        options:
            song:
                name: 'chanson'
                description: 'Nom de la chanson/URL'
    pause:
        name: 'pause'
        description: 'Met en pause la musique en cours'
    resume:
        name: 'resume'
        description: 'Reprend la musique en pause'
    skip:
        name: 'skip'
        description: 'Passe la chanson actuelle et joue la suivante'
    stop:
        name: 'stop'
        description: 'Arrête la musique et se déconnecte du salon vocal'
    loop:
        name: 'loop'
        description: 'Active ou désactive le mode répétition pour la piste actuelle'
    autoplay:
        name: 'autoplay'
        description: 'Active ou désactive la lecture automatique intelligente basée sur vos préférences musicales'
        options:
            enabled:
                name: 'activé'
                description: 'Activer ou désactiver la lecture automatique'
    language:
        name: 'language'
        description: 'Définir les préférences de langue du bot'
        options:
            scope:
                name: 'portée'
                description: "Définir la langue pour l'utilisateur ou le serveur"
                choices:
                    user: 'utilisateur'
                    server: 'serveur'
                    reset: 'réinitialiser'
            language:
                name: 'langue'
                description: 'Choisissez votre langue préférée'
    feedback:
        name: 'feedback'
        description: 'Envoyer des commentaires aux développeurs'
    ping:
        name: 'ping'
        description: "Vérifier la latence et l'état de connexion du bot"
    help:
        name: 'help'
        description: 'Afficher toutes les commandes disponibles et leurs descriptions'
        options:
            command:
                name: 'commande'
                description: 'Obtenir des informations détaillées sur une commande spécifique'
    filter:
        name: 'filter'
        description: 'Appliquer des filtres audio pour améliorer votre expérience musicale'
        options:
            type:
                name: 'type'
                description: 'Choisir un filtre audio à appliquer'
    chart:
        name: 'chart'
        description: 'Afficher les analyses et classements musicaux'
        options:
            scope:
                name: 'portée'
                description: 'Choisir la portée des analyses'
                choices:
                    user: 'Personnel'
                    guild: 'Serveur'
                    global: 'Global'
            limit:
                name: 'limite'
                description: "Nombre d'éléments principaux à afficher (5-20)"
    lyrics:
        name: 'lyrics'
        description: 'Afficher les paroles de la piste en cours de lecture'
    queue:
        name: 'queue'
        description: "Afficher et gérer la file d'attente musicale"
    dj:
        name: 'dj'
        description: 'Gérer le rôle DJ pour les commandes musicales'
        options:
            role:
                name: 'rôle'
                description: 'Le rôle à définir/supprimer comme rôle DJ (laisser vide pour créer/désactiver)'
    login:
        name: 'login'
        description: 'Connecter votre compte musical à Pepper'
        options:
            account:
                name: 'compte'
                description: 'Le service musical à connecter'
                choices:
                    spotify: 'Spotify'
            profile:
                name: 'profil'
                description: "Le lien de votre profil Spotify (app Spotify > Profil > Partager > Copier le lien)"
    logout:
        name: 'logout'
        description: 'Déconnecter votre compte musical de Pepper'
        options:
            account:
                name: 'compte'
                description: 'Le service musical à déconnecter'
                choices:
                    spotify: 'Spotify'
    volume:
        name: 'volume'
        description: 'Régler le volume de lecture de la musique'
        options:
            volume:
                name: 'volume'
                description: 'Niveau de volume (1-100)'

    playlist:
        name: 'playlist'
        description: 'Créer et gérer vos propres playlists'
        subcommands:
            create:
                name: 'create'
                description: 'Créer une nouvelle playlist'
            delete:
                name: 'delete'
                description: 'Supprimer une de vos playlists'
            rename:
                name: 'rename'
                description: 'Renommer une de vos playlists'
            list:
                name: 'list'
                description: 'Afficher toutes vos playlists'
            view:
                name: 'view'
                description: "Afficher les chansons d'une playlist"
            share:
                name: 'share'
                description: "Partager le code d'une playlist dans ce salon"
            visibility:
                name: 'visibility'
                description: 'Rendre une playlist publique ou privée'
            transfer:
                name: 'transfer'
                description: 'Transférer une playlist à un autre utilisateur'
        groups:
            song:
                name: 'song'
                description: "Gérer les chansons d'une playlist"
                subcommands:
                    add:
                        name: 'add'
                        description: "Rechercher une chanson et l'ajouter à une playlist"
                    current:
                        name: 'current'
                        description: 'Ajouter la chanson en cours de lecture à une playlist'
                    remove:
                        name: 'remove'
                        description: "Retirer une chanson d'une playlist"
                    move:
                        name: 'move'
                        description: 'Déplacer une chanson à une autre position'
        options:
            playlist:
                name: 'playlist'
                description: 'Une de vos playlists'
            playlist_or_code:
                name: 'playlist'
                description: 'Une de vos playlists ou un code de partage public'
            name:
                name: 'name'
                description: 'Nom de la playlist (50 caractères max.)'
            new_name:
                name: 'name'
                description: 'Nouveau nom de la playlist (50 caractères max.)'
            visibility:
                name: 'visibility'
                description: 'Qui peut écouter la playlist (par défaut : privée)'
            state:
                name: 'state'
                description: 'Toute personne ayant le code peut écouter une playlist publique'
            song:
                name: 'song'
                description: 'Nom ou URL de la chanson à rechercher'
            position:
                name: 'position'
                description: 'Position de la chanson à retirer'
            from:
                name: 'from'
                description: 'Position actuelle de la chanson'
            to:
                name: 'to'
                description: 'Nouvelle position de la chanson'
            user:
                name: 'user'
                description: "L'utilisateur qui deviendra le nouveau propriétaire"
        choices:
            public: 'Publique'
            private: 'Privée'

