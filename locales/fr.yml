commands:
    play:
        name: 'play'
        description: 'Joue une chanson par nom ou URL'
        options:
            song:
                name: 'chanson'
                description: 'Nom de la chanson/URL'
    pause:
        name: 'pause'
        description: 'Met en pause la musique en cours'
    resume:
        name: 'resume'
        description: 'Reprend la musique en pause'
    skip:
        name: 'skip'
        description: 'Passe la chanson actuelle et joue la suivante'
    stop:
        name: 'stop'
        description: 'Arrête la musique et se déconnecte du salon vocal'
    loop:
        name: 'loop'
        description: 'Active ou désactive le mode répétition pour la piste actuelle'
    autoplay:
        name: 'autoplay'
        description: 'Active ou désactive la lecture automatique intelligente basée sur vos préférences musicales'
        options:
            enabled:
                name: 'activé'
                description: 'Activer ou désactiver la lecture automatique'
    language:
        name: 'language'
        description: 'Définir les préférences de langue du bot'
        options:
            scope:
                name: 'portée'
                description: "Définir la langue pour l'utilisateur ou le serveur"
                choices:
                    user: 'utilisateur'
                    server: 'serveur'
                    reset: 'réinitialiser'
            language:
                name: 'langue'
                description: 'Choisissez votre langue préférée'
    feedback:
        name: 'feedback'
        description: 'Envoyer des commentaires aux développeurs'
    ping:
        name: 'ping'
        description: "Vérifier la latence et l'état de connexion du bot"
    help:
        name: 'help'
        description: 'Afficher toutes les commandes disponibles et leurs descriptions'
        options:
            command:
                name: 'commande'
                description: 'Obtenir des informations détaillées sur une commande spécifique'
    filter:
        name: 'filter'
        description: 'Appliquer des filtres audio pour améliorer votre expérience musicale'
        options:
            type:
                name: 'type'
                description: 'Choisir un filtre audio à appliquer'
    chart:
        name: 'chart'
        description: 'Afficher les analyses et classements musicaux'
        options:
            scope:
                name: 'portée'
                description: 'Choisir la portée des analyses'
                choices:
                    user: 'Personnel'
                    guild: 'Serveur'
                    global: 'Global'
            limit:
                name: 'limite'
                description: "Nombre d'éléments principaux à afficher (5-20)"
    lyrics:
        name: 'lyrics'
        description: 'Afficher les paroles de la piste en cours de lecture'
    queue:
        name: 'queue'
        description: "Afficher et gérer la file d'attente musicale"
    dj:
        name: 'dj'
        description: 'Gérer le rôle DJ pour les commandes musicales'
        options:
            role:
                name: 'rôle'
                description: 'Le rôle à définir/supprimer comme rôle DJ (laisser vide pour créer/désactiver)'
    login:
        name: 'login'
        description: 'Connecter votre compte musical à Pepper'
        options:
            account:
                name: 'compte'
                description: 'Le service musical à connecter'
                choices:
                    spotify: 'Spotify'
    logout:
        name: 'logout'
        description: 'Déconnecter votre compte musical de Pepper'
        options:
            account:
                name: 'compte'
                description: 'Le service musical à déconnecter'
                choices:
                    spotify: 'Spotify'
    volume:
        name: 'volume'
        description: 'Régler le volume de lecture de la musique'
        options:
            volume:
                name: 'volume'
                description: 'Niveau de volume (1-100)'
    24-7:
        name: '24-7'
        description: "Activer/désactiver le mode 24/7 pour garder le bot dans le salon vocal"

