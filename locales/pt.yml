commands:
    play:
        name: 'play'
        description: 'Reproduzir uma música por nome ou URL'
        options:
            song:
                name: 'música'
                description: 'Nome da música/URL'
    pause:
        name: 'pause'
        description: 'Pausar a música que está tocando'
    resume:
        name: 'resume'
        description: 'Retomar a música pausada'
    skip:
        name: 'skip'
        description: 'Pular a música atual e tocar a próxima'
    stop:
        name: 'stop'
        description: 'Parar a música e desconectar do canal de voz'
    loop:
        name: 'loop'
        description: 'Ativar ou desativar o modo de repetição para a faixa atual'
    autoplay:
        name: 'autoplay'
        description: 'Ativar ou desativar a reprodução automática inteligente baseada nas suas preferências musicais'
        options:
            enabled:
                name: 'ativado'
                description: 'Ativar ou desativar a reprodução automática'
    language:
        name: 'language'
        description: 'Definir preferências de idioma do bot'
        options:
            scope:
                name: 'escopo'
                description: 'Definir idioma para usuário ou servidor'
                choices:
                    user: 'usuário'
                    server: 'servidor'
                    reset: 'redefinir'
            language:
                name: 'idioma'
                description: 'Escolha seu idioma preferido'
    feedback:
        name: 'feedback'
        description: 'Enviar feedback aos desenvolvedores'
    ping:
        name: 'ping'
        description: 'Verificar a latência e o status de conexão do bot'
    help:
        name: 'help'
        description: 'Exibir todos os comandos disponíveis e suas descrições'
        options:
            command:
                name: 'comando'
                description: 'Obter informações detalhadas sobre um comando específico'
    filter:
        name: 'filter'
        description: 'Aplicar filtros de áudio para melhorar sua experiência musical'
        options:
            type:
                name: 'tipo'
                description: 'Escolha um filtro de áudio para aplicar'
    chart:
        name: 'chart'
        description: 'Exibir análises e charts de música'
        options:
            scope:
                name: 'escopo'
                description: 'Escolha o escopo para as análises'
                choices:
                    user: 'Pessoal'
                    guild: 'Servidor'
                    global: 'Global'
            limit:
                name: 'limite'
                description: 'Número de itens principais a exibir (5-20)'
    lyrics:
        name: 'lyrics'
        description: 'Exibir a letra da faixa que está tocando'
    queue:
        name: 'queue'
        description: 'Exibir e gerenciar a fila de músicas'
    dj:
        name: 'dj'
        description: 'Gerenciar o cargo de DJ para comandos de música'
        options:
            role:
                name: 'cargo'
                description: 'O cargo a definir/remover como cargo de DJ (deixe vazio para criar/desativar)'
    login:
        name: 'login'
        description: 'Conectar sua conta de música ao Pepper'
        options:
            account:
                name: 'conta'
                description: 'O serviço de música a conectar'
                choices:
                    spotify: 'Spotify'
    logout:
        name: 'logout'
        description: 'Desconectar sua conta de música do Pepper'
        options:
            account:
                name: 'conta'
                description: 'O serviço de música a desconectar'
                choices:
                    spotify: 'Spotify'
    volume:
        name: 'volume'
        description: 'Definir o volume de reprodução de música'
        options:
            volume:
                name: 'volume'
                description: 'Nível de volume (1-100)'
    24-7:
        name: '24-7'
        description: 'Alternar o modo 24/7 para manter o bot no canal de voz'

