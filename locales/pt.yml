commands:
    play:
        name: 'play'
        description: 'Reproduzir uma música por nome ou URL'
        options:
            song:
                name: 'música'
                description: 'Nome da música/URL'
    pause:
        name: 'pause'
        description: 'Pausar a música que está tocando'
    resume:
        name: 'resume'
        description: 'Retomar a música pausada'
    skip:
        name: 'skip'
        description: 'Pular a música atual e tocar a próxima'
    stop:
        name: 'stop'
        description: 'Parar a música e desconectar do canal de voz'
    loop:
        name: 'loop'
        description: 'Ativar ou desativar o modo de repetição para a faixa atual'
    autoplay:
        name: 'autoplay'
        description: 'Ativar ou desativar a reprodução automática inteligente baseada nas suas preferências musicais'
        options:
            enabled:
                name: 'ativado'
                description: 'Ativar ou desativar a reprodução automática'
    language:
        name: 'language'
        description: 'Definir preferências de idioma do bot'
        options:
            scope:
                name: 'escopo'
                description: 'Definir idioma para usuário ou servidor'
                choices:
                    user: 'usuário'
                    server: 'servidor'
                    reset: 'redefinir'
            language:
                name: 'idioma'
                description: 'Escolha seu idioma preferido'
    feedback:
        name: 'feedback'
        description: 'Enviar feedback aos desenvolvedores'
    ping:
        name: 'ping'
        description: 'Verificar a latência e o status de conexão do bot'
    help:
        name: 'help'
        description: 'Exibir todos os comandos disponíveis e suas descrições'
        options:
            command:
                name: 'comando'
                description: 'Obter informações detalhadas sobre um comando específico'
    filter:
        name: 'filter'
        description: 'Aplicar filtros de áudio para melhorar sua experiência musical'
        options:
            type:
                name: 'tipo'
                description: 'Escolha um filtro de áudio para aplicar'
    chart:
        name: 'chart'
        description: 'Exibir análises e charts de música'
        options:
            scope:
                name: 'escopo'
                description: 'Escolha o escopo para as análises'
                choices:
                    user: 'Pessoal'
                    guild: 'Servidor'
                    global: 'Global'
            limit:
                name: 'limite'
                description: 'Número de itens principais a exibir (5-20)'
    lyrics:
        name: 'lyrics'
        description: 'Exibir a letra da faixa que está tocando'
    queue:
        name: 'queue'
        description: 'Exibir e gerenciar a fila de músicas'
    dj:
        name: 'dj'
        description: 'Gerenciar o cargo de DJ para comandos de música'
        options:
            role:
                name: 'cargo'
                description: 'O cargo a definir/remover como cargo de DJ (deixe vazio para criar/desativar)'
    login:
        name: 'login'
        description: 'Conectar sua conta de música ao Pepper'
        options:
            account:
                name: 'conta'
                description: 'O serviço de música a conectar'
                choices:
                    spotify: 'Spotify'
            profile:
                name: 'perfil'
                description: "O link do seu perfil do Spotify (app do Spotify > Perfil > Compartilhar > Copiar link)"
    logout:
        name: 'logout'
        description: 'Desconectar sua conta de música do Pepper'
        options:
            account:
                name: 'conta'
                description: 'O serviço de música a desconectar'
                choices:
                    spotify: 'Spotify'
    volume:
        name: 'volume'
        description: 'Definir o volume de reprodução de música'
        options:
            volume:
                name: 'volume'
                description: 'Nível de volume (1-100)'

    playlist:
        name: 'playlist'
        description: 'Criar e gerenciar suas próprias playlists'
        subcommands:
            create:
                name: 'create'
                description: 'Criar uma nova playlist'
            delete:
                name: 'delete'
                description: 'Excluir uma das suas playlists'
            rename:
                name: 'rename'
                description: 'Renomear uma das suas playlists'
            list:
                name: 'list'
                description: 'Mostrar todas as suas playlists'
            view:
                name: 'view'
                description: 'Mostrar as músicas de uma playlist'
            share:
                name: 'share'
                description: 'Compartilhar o código de uma playlist neste canal'
            visibility:
                name: 'visibility'
                description: 'Tornar uma playlist pública ou privada'
            transfer:
                name: 'transfer'
                description: 'Transferir uma playlist para outro usuário'
        groups:
            song:
                name: 'song'
                description: 'Gerenciar as músicas de uma playlist'
                subcommands:
                    add:
                        name: 'add'
                        description: 'Pesquisar uma música e adicioná-la a uma playlist'
                    current:
                        name: 'current'
                        description: 'Adicionar a música que está tocando a uma playlist'
                    remove:
                        name: 'remove'
                        description: 'Remover uma música de uma playlist'
                    move:
                        name: 'move'
                        description: 'Mover uma música para outra posição'
        options:
            playlist:
                name: 'playlist'
                description: 'Uma das suas playlists'
            playlist_or_code:
                name: 'playlist'
                description: 'Uma das suas playlists ou um código de compartilhamento público'
            name:
                name: 'name'
                description: 'Nome da playlist (até 50 caracteres)'
            new_name:
                name: 'name'
                description: 'Novo nome da playlist (até 50 caracteres)'
            visibility:
                name: 'visibility'
                description: 'Quem pode tocar a playlist (padrão: privada)'
            state:
                name: 'state'
                description: 'Qualquer pessoa com o código pode tocar playlists públicas'
            song:
                name: 'song'
                description: 'Nome ou URL da música para pesquisar'
            position:
                name: 'position'
                description: 'Posição da música a remover'
            from:
                name: 'from'
                description: 'Posição atual da música'
            to:
                name: 'to'
                description: 'Nova posição da música'
            user:
                name: 'user'
                description: 'O usuário que será o novo dono'
        choices:
            public: 'Pública'
            private: 'Privada'

