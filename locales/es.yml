commands:
    play:
        name: 'play'
        description: 'Reproduce una canción por nombre o URL'
        options:
            song:
                name: 'canción'
                description: 'Nombre de la canción/URL'
    radio:
        name: 'radio'
        description: 'Reproduce una emisora de radio en directo'
        options:
            station:
                name: 'emisora'
                description: 'Nombre de la emisora, género o frecuencia'
    pause:
        name: 'pause'
        description: 'Pausa la música que se está reproduciendo'
    resume:
        name: 'resume'
        description: 'Reanuda la música pausada'
    skip:
        name: 'skip'
        description: 'Salta la canción actual y reproduce la siguiente'
    stop:
        name: 'stop'
        description: 'Detiene la música y desconecta del canal de voz'
    loop:
        name: 'loop'
        description: 'Activa o desactiva el modo de repetición para la pista actual'
    autoplay:
        name: 'autoplay'
        description: 'Activa o desactiva la reproducción automática inteligente basada en tus preferencias musicales'
        options:
            enabled:
                name: 'activado'
                description: 'Activar o desactivar la reproducción automática'
    language:
        name: 'language'
        description: 'Configura las preferencias de idioma del bot'
        options:
            scope:
                name: 'alcance'
                description: 'Establecer idioma para usuario o servidor'
                choices:
                    user: 'usuario'
                    server: 'servidor'
                    reset: 'restablecer'
            language:
                name: 'idioma'
                description: 'Elige tu idioma preferido'
    feedback:
        name: 'feedback'
        description: 'Envía comentarios a los desarrolladores'
    ping:
        name: 'ping'
        description: 'Verifica la latencia y el estado de conexión del bot'
    help:
        name: 'help'
        description: 'Muestra todos los comandos disponibles y sus descripciones'
        options:
            command:
                name: 'comando'
                description: 'Obtén información detallada sobre un comando específico'
    filter:
        name: 'filter'
        description: 'Aplica filtros de audio para mejorar tu experiencia musical'
        options:
            type:
                name: 'tipo'
                description: 'Elige un filtro de audio para aplicar'
    chart:
        name: 'chart'
        description: 'Muestra análisis y charts de música'
        options:
            scope:
                name: 'alcance'
                description: 'Elige el alcance para los análisis'
                choices:
                    user: 'Personal'
                    guild: 'Servidor'
                    global: 'Global'
            limit:
                name: 'límite'
                description: 'Número de elementos principales a mostrar (5-20)'
    lyrics:
        name: 'lyrics'
        description: 'Muestra la letra de la pista que se está reproduciendo'
    queue:
        name: 'queue'
        description: 'Muestra y administra la cola de música'
    dj:
        name: 'dj'
        description: 'Administra el rol de DJ para comandos de música'
        options:
            role:
                name: 'rol'
                description: 'El rol a establecer/eliminar como rol de DJ (dejar vacío para crear/desactivar)'
    login:
        name: 'login'
        description: 'Conecta tu cuenta de música a Pepper'
        options:
            account:
                name: 'cuenta'
                description: 'El servicio de música a conectar'
                choices:
                    spotify: 'Spotify'
            profile:
                name: 'perfil'
                description: "Tu enlace de perfil de Spotify (app de Spotify > Perfil > Compartir > Copiar enlace)"
    logout:
        name: 'logout'
        description: 'Desconecta tu cuenta de música de Pepper'
        options:
            account:
                name: 'cuenta'
                description: 'El servicio de música a desconectar'
                choices:
                    spotify: 'Spotify'
    volume:
        name: 'volume'
        description: 'Establecer el volumen de reproducción de música'
        options:
            volume:
                name: 'volumen'
                description: 'Nivel de volumen (1-100)'

    playlist:
        name: 'playlist'
        description: 'Crea y gestiona tus propias playlists'
        subcommands:
            create:
                name: 'create'
                description: 'Crea una nueva playlist'
            delete:
                name: 'delete'
                description: 'Elimina una de tus playlists'
            rename:
                name: 'rename'
                description: 'Cambia el nombre de una de tus playlists'
            list:
                name: 'list'
                description: 'Muestra todas tus playlists'
            view:
                name: 'view'
                description: 'Muestra las canciones de una playlist'
            share:
                name: 'share'
                description: 'Comparte el código de una playlist en este canal'
            visibility:
                name: 'visibility'
                description: 'Haz que una playlist sea pública o privada'
            transfer:
                name: 'transfer'
                description: 'Transfiere una playlist a otro usuario'
        groups:
            song:
                name: 'song'
                description: 'Gestiona las canciones de una playlist'
                subcommands:
                    add:
                        name: 'add'
                        description: 'Busca una canción y añádela a una playlist'
                    current:
                        name: 'current'
                        description: 'Añade la canción que suena ahora a una playlist'
                    remove:
                        name: 'remove'
                        description: 'Quita una canción de una playlist'
                    move:
                        name: 'move'
                        description: 'Mueve una canción a otra posición'
        options:
            playlist:
                name: 'playlist'
                description: 'Una de tus playlists'
            playlist_or_code:
                name: 'playlist'
                description: 'Una de tus playlists o un código público para compartir'
            name:
                name: 'name'
                description: 'Nombre de la playlist (hasta 50 caracteres)'
            new_name:
                name: 'name'
                description: 'Nuevo nombre de la playlist (hasta 50 caracteres)'
            visibility:
                name: 'visibility'
                description: 'Quién puede reproducir la playlist (por defecto: privada)'
            state:
                name: 'state'
                description: 'Cualquiera con el código puede reproducir las playlists públicas'
            song:
                name: 'song'
                description: 'Nombre o URL de la canción a buscar'
            position:
                name: 'position'
                description: 'Posición de la canción a quitar'
            from:
                name: 'from'
                description: 'Posición actual de la canción'
            to:
                name: 'to'
                description: 'Nueva posición de la canción'
            user:
                name: 'user'
                description: 'El usuario que será el nuevo propietario'
        choices:
            public: 'Pública'
            private: 'Privada'

