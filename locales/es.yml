commands:
    play:
        name: 'play'
        description: 'Reproduce una canción por nombre o URL'
        options:
            song:
                name: 'canción'
                description: 'Nombre de la canción/URL'
    pause:
        name: 'pause'
        description: 'Pausa la música que se está reproduciendo'
    resume:
        name: 'resume'
        description: 'Reanuda la música pausada'
    skip:
        name: 'skip'
        description: 'Salta la canción actual y reproduce la siguiente'
    stop:
        name: 'stop'
        description: 'Detiene la música y desconecta del canal de voz'
    loop:
        name: 'loop'
        description: 'Activa o desactiva el modo de repetición para la pista actual'
    autoplay:
        name: 'autoplay'
        description: 'Activa o desactiva la reproducción automática inteligente basada en tus preferencias musicales'
        options:
            enabled:
                name: 'activado'
                description: 'Activar o desactivar la reproducción automática'
    language:
        name: 'language'
        description: 'Configura las preferencias de idioma del bot'
        options:
            scope:
                name: 'alcance'
                description: 'Establecer idioma para usuario o servidor'
                choices:
                    user: 'usuario'
                    server: 'servidor'
                    reset: 'restablecer'
            language:
                name: 'idioma'
                description: 'Elige tu idioma preferido'
    feedback:
        name: 'feedback'
        description: 'Envía comentarios a los desarrolladores'
    ping:
        name: 'ping'
        description: 'Verifica la latencia y el estado de conexión del bot'
    help:
        name: 'help'
        description: 'Muestra todos los comandos disponibles y sus descripciones'
        options:
            command:
                name: 'comando'
                description: 'Obtén información detallada sobre un comando específico'
    filter:
        name: 'filter'
        description: 'Aplica filtros de audio para mejorar tu experiencia musical'
        options:
            type:
                name: 'tipo'
                description: 'Elige un filtro de audio para aplicar'
    chart:
        name: 'chart'
        description: 'Muestra análisis y charts de música'
        options:
            scope:
                name: 'alcance'
                description: 'Elige el alcance para los análisis'
                choices:
                    user: 'Personal'
                    guild: 'Servidor'
                    global: 'Global'
            limit:
                name: 'límite'
                description: 'Número de elementos principales a mostrar (5-20)'
    lyrics:
        name: 'lyrics'
        description: 'Muestra la letra de la pista que se está reproduciendo'
    queue:
        name: 'queue'
        description: 'Muestra y administra la cola de música'
    dj:
        name: 'dj'
        description: 'Administra el rol de DJ para comandos de música'
        options:
            role:
                name: 'rol'
                description: 'El rol a establecer/eliminar como rol de DJ (dejar vacío para crear/desactivar)'
    login:
        name: 'login'
        description: 'Conecta tu cuenta de música a Pepper'
        options:
            account:
                name: 'cuenta'
                description: 'El servicio de música a conectar'
                choices:
                    spotify: 'Spotify'
    logout:
        name: 'logout'
        description: 'Desconecta tu cuenta de música de Pepper'
        options:
            account:
                name: 'cuenta'
                description: 'El servicio de música a desconectar'
                choices:
                    spotify: 'Spotify'
    volume:
        name: 'volume'
        description: 'Establecer el volumen de reproducción de música'
        options:
            volume:
                name: 'volumen'
                description: 'Nivel de volumen (1-100)'
    24-7:
        name: '24-7'
        description: 'Alternar el modo 24/7 para mantener el bot en el canal de voz'

