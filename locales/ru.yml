commands:
    play:
        name: 'play'
        description: 'Воспроизвести песню по названию или URL'
        options:
            song:
                name: 'песня'
                description: 'Название песни/URL'
    pause:
        name: 'pause'
        description: 'Поставить на паузу текущую музыку'
    resume:
        name: 'resume'
        description: 'Продолжить воспроизведение музыки'
    skip:
        name: 'skip'
        description: 'Пропустить текущую песню и воспроизвести следующую'
    stop:
        name: 'stop'
        description: 'Остановить музыку и отключиться от голосового канала'
    loop:
        name: 'loop'
        description: 'Включить или выключить режим повтора для текущего трека'
    autoplay:
        name: 'autoplay'
        description: 'Включить или выключить умное автовоспроизведение на основе ваших музыкальных предпочтений'
        options:
            enabled:
                name: 'включено'
                description: 'Включить или выключить автовоспроизведение'
    language:
        name: 'language'
        description: 'Настроить языковые предпочтения бота'
        options:
            scope:
                name: 'область'
                description: 'Установить язык для пользователя или сервера'
                choices:
                    user: 'пользователь'
                    server: 'сервер'
                    reset: 'сбросить'
            language:
                name: 'язык'
                description: 'Выберите предпочитаемый язык'
    feedback:
        name: 'feedback'
        description: 'Отправить отзыв разработчикам'
    ping:
        name: 'ping'
        description: 'Проверить задержку и состояние подключения бота'
    help:
        name: 'help'
        description: 'Показать все доступные команды и их описания'
        options:
            command:
                name: 'команда'
                description: 'Получить подробную информацию о конкретной команде'
    filter:
        name: 'filter'
        description: 'Применить аудиофильтры для улучшения музыкального опыта'
        options:
            type:
                name: 'тип'
                description: 'Выберите аудиофильтр для применения'
    chart:
        name: 'chart'
        description: 'Показать музыкальную аналитику и чарты'
        options:
            scope:
                name: 'область'
                description: 'Выберите область для аналитики'
                choices:
                    user: 'Личный'
                    guild: 'Сервер'
                    global: 'Глобальный'
            limit:
                name: 'лимит'
                description: 'Количество топ-элементов для отображения (5-20)'
    lyrics:
        name: 'lyrics'
        description: 'Показать текст песни для текущего трека'
    queue:
        name: 'queue'
        description: 'Показать и управлять очередью воспроизведения'
    dj:
        name: 'dj'
        description: 'Управление ролью DJ для музыкальных команд'
        options:
            role:
                name: 'роль'
                description: 'Роль для установки/удаления как DJ (оставьте пустым для создания/отключения)'
    login:
        name: 'login'
        description: 'Подключить ваш музыкальный аккаунт к Pepper'
        options:
            account:
                name: 'аккаунт'
                description: 'Музыкальный сервис для подключения'
                choices:
                    spotify: 'Spotify'
            profile:
                name: 'профиль'
                description: "Ссылка на ваш профиль Spotify (приложение Spotify > Профиль > Поделиться > Копировать)"
    volume:
        name: 'громкость'
        description: 'Установить громкость воспроизведения музыки'
        options:
            volume:
                name: 'громкость'
                description: 'Уровень громкости (1-100)'
    logout:
        name: 'logout'
        description: 'Отключить ваш музыкальный аккаунт от Pepper'
        options:
            account:
                name: 'аккаунт'
                description: 'Музыкальный сервис для отключения'
                choices:
                    spotify: 'Spotify'

    playlist:
        name: 'playlist'
        description: 'Создавать плейлисты и управлять ими'
        subcommands:
            create:
                name: 'create'
                description: 'Создать новый плейлист'
            delete:
                name: 'delete'
                description: 'Удалить один из ваших плейлистов'
            rename:
                name: 'rename'
                description: 'Переименовать один из ваших плейлистов'
            list:
                name: 'list'
                description: 'Показать все ваши плейлисты'
            view:
                name: 'view'
                description: 'Показать песни в плейлисте'
            share:
                name: 'share'
                description: 'Поделиться кодом плейлиста в этом канале'
            visibility:
                name: 'visibility'
                description: 'Сделать плейлист публичным или приватным'
            transfer:
                name: 'transfer'
                description: 'Передать плейлист другому пользователю'
        groups:
            song:
                name: 'song'
                description: 'Управлять песнями в плейлисте'
                subcommands:
                    add:
                        name: 'add'
                        description: 'Найти песню и добавить её в плейлист'
                    current:
                        name: 'current'
                        description: 'Добавить текущую песню в плейлист'
                    remove:
                        name: 'remove'
                        description: 'Удалить песню из плейлиста'
                    move:
                        name: 'move'
                        description: 'Переместить песню на другую позицию'
        options:
            playlist:
                name: 'playlist'
                description: 'Один из ваших плейлистов'
            playlist_or_code:
                name: 'playlist'
                description: 'Один из ваших плейлистов или публичный код'
            name:
                name: 'name'
                description: 'Название плейлиста (до 50 символов)'
            new_name:
                name: 'name'
                description: 'Новое название плейлиста (до 50 символов)'
            visibility:
                name: 'visibility'
                description: 'Кто может слушать плейлист (по умолчанию: приватный)'
            state:
                name: 'state'
                description: 'Публичный плейлист может слушать любой, у кого есть код'
            song:
                name: 'song'
                description: 'Название или URL песни для поиска'
            position:
                name: 'position'
                description: 'Позиция песни для удаления'
            from:
                name: 'from'
                description: 'Текущая позиция песни'
            to:
                name: 'to'
                description: 'Новая позиция песни'
            user:
                name: 'user'
                description: 'Пользователь, который станет новым владельцем'
        choices:
            public: 'Публичный'
            private: 'Приватный'

