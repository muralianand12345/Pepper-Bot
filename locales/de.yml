commands:
    play:
        name: 'play'
        description: 'Spiele einen Song per Songname oder URL ab'
        options:
            song:
                name: 'song'
                description: 'Liedname/URL'
    radio:
        name: 'radio'
        description: 'Einen Live-Radiosender abspielen'
        options:
            station:
                name: 'sender'
                description: 'Sendername, Genre oder Frequenz'
    pause:
        name: 'pause'
        description: 'Pausiere die aktuell spielende Musik'
    resume:
        name: 'resume'
        description: 'Setze die pausierte Musik fort'
    skip:
        name: 'skip'
        description: 'Überspringe den aktuellen Song und spiele den nächsten'
    stop:
        name: 'stop'
        description: 'Stoppe die Musik und trenne die Verbindung zum Sprachkanal'
    loop:
        name: 'loop'
        description: 'Wiederholungsmodus für den aktuellen Track umschalten'
    autoplay:
        name: 'autoplay'
        description: 'Intelligente Autoplay-Funktion basierend auf deinen Musikvorlieben umschalten'
        options:
            enabled:
                name: 'aktiviert'
                description: 'Autoplay aktivieren oder deaktivieren'
    language:
        name: 'language'
        description: 'Spracheinstellungen für den Bot festlegen'
        options:
            scope:
                name: 'bereich'
                description: 'Sprache für Benutzer oder Server festlegen'
                choices:
                    user: 'benutzer'
                    server: 'server'
                    reset: 'zurücksetzen'
            language:
                name: 'sprache'
                description: 'Wähle deine bevorzugte Sprache'
    feedback:
        name: 'feedback'
        description: 'Sende Feedback an die Entwickler'
    ping:
        name: 'ping'
        description: 'Überprüfe die Latenz und den Verbindungsstatus des Bots'
    help:
        name: 'help'
        description: 'Zeige alle verfügbaren Befehle und ihre Beschreibungen an'
        options:
            command:
                name: 'befehl'
                description: 'Erhalte detaillierte Informationen über einen bestimmten Befehl'
    filter:
        name: 'filter'
        description: 'Wende Audiofilter an, um dein Musikerlebnis zu verbessern'
        options:
            type:
                name: 'typ'
                description: 'Wähle einen Audiofilter zum Anwenden'
    chart:
        name: 'chart'
        description: 'Zeige Musikanalysen und Charts an'
        options:
            scope:
                name: 'bereich'
                description: 'Wähle den Bereich für die Analysen'
                choices:
                    user: 'Persönlich'
                    guild: 'Server'
                    global: 'Global'
            limit:
                name: 'limit'
                description: 'Anzahl der anzuzeigenden Top-Einträge (5-20)'
    lyrics:
        name: 'lyrics'
        description: 'Zeige den Liedtext für den aktuell spielenden Track an'
    queue:
        name: 'queue'
        description: 'Zeige und verwalte die Musikwarteschlange'
    dj:
        name: 'dj'
        description: 'Verwalte die DJ-Rolle für Musikbefehle'
        options:
            role:
                name: 'rolle'
                description: 'Die Rolle, die als DJ-Rolle festgelegt/entfernt werden soll (leer lassen zum Erstellen/Deaktivieren)'
    login:
        name: 'login'
        description: 'Verbinde dein Musikkonto mit Pepper'
        options:
            account:
                name: 'konto'
                description: 'Der Musikdienst zum Verbinden'
                choices:
                    spotify: 'Spotify'
            profile:
                name: 'profil'
                description: "Dein Spotify-Profillink (Spotify-App > Profil > Teilen > Link kopieren)"
    logout:
        name: 'logout'
        description: 'Trenne dein Musikkonto von Pepper'
        options:
            account:
                name: 'konto'
                description: 'Der Musikdienst zum Trennen'
                choices:
                    spotify: 'Spotify'
    volume:
        name: 'volume'
        description: 'Lautstärke der Musikwiedergabe einstellen'
        options:
            volume:
                name: 'lautstärke'
                description: 'Lautstärkepegel (1-100)'

    playlist:
        name: 'playlist'
        description: 'Erstelle und verwalte deine eigenen Playlists'
        subcommands:
            create:
                name: 'create'
                description: 'Erstelle eine neue Playlist'
            delete:
                name: 'delete'
                description: 'Lösche eine deiner Playlists'
            rename:
                name: 'rename'
                description: 'Benenne eine deiner Playlists um'
            list:
                name: 'list'
                description: 'Zeige alle deine Playlists'
            view:
                name: 'view'
                description: 'Zeige die Songs einer Playlist'
            share:
                name: 'share'
                description: 'Teile einen Playlist-Code in diesem Kanal'
            visibility:
                name: 'visibility'
                description: 'Mache eine Playlist öffentlich oder privat'
            transfer:
                name: 'transfer'
                description: 'Übertrage eine Playlist an einen anderen Benutzer'
        groups:
            song:
                name: 'song'
                description: 'Verwalte die Songs einer Playlist'
                subcommands:
                    add:
                        name: 'add'
                        description: 'Suche einen Song und füge ihn einer Playlist hinzu'
                    current:
                        name: 'current'
                        description: 'Füge den aktuell spielenden Song einer Playlist hinzu'
                    remove:
                        name: 'remove'
                        description: 'Entferne einen Song aus einer Playlist'
                    move:
                        name: 'move'
                        description: 'Verschiebe einen Song an eine andere Position'
        options:
            playlist:
                name: 'playlist'
                description: 'Eine deiner Playlists'
            playlist_or_code:
                name: 'playlist'
                description: 'Eine deiner Playlists oder ein öffentlicher Teilen-Code'
            name:
                name: 'name'
                description: 'Name der Playlist (bis zu 50 Zeichen)'
            new_name:
                name: 'name'
                description: 'Neuer Name der Playlist (bis zu 50 Zeichen)'
            visibility:
                name: 'visibility'
                description: 'Wer die Playlist abspielen kann (Standard: privat)'
            state:
                name: 'state'
                description: 'Öffentliche Playlists kann jeder mit dem Code abspielen'
            song:
                name: 'song'
                description: 'Songname oder URL für die Suche'
            position:
                name: 'position'
                description: 'Position des zu entfernenden Songs'
            from:
                name: 'from'
                description: 'Aktuelle Position des Songs'
            to:
                name: 'to'
                description: 'Neue Position des Songs'
            user:
                name: 'user'
                description: 'Der Benutzer, der neuer Besitzer werden soll'
        choices:
            public: 'Öffentlich'
            private: 'Privat'

