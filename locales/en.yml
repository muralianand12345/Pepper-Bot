commands:
    play:
        name: 'play'
        description: 'Play a song via song name or url'
        options:
            song:
                name: 'song'
                description: 'Song Name/URL'
    pause:
        name: 'pause'
        description: 'Pause the currently playing music'
    resume:
        name: 'resume'
        description: 'Resume the paused music'
    skip:
        name: 'skip'
        description: 'Skip the current song and play the next one'
    stop:
        name: 'stop'
        description: 'Stop the music and disconnect from voice channel'
    loop:
        name: 'loop'
        description: 'Toggle loop mode for the current track'
    autoplay:
        name: 'autoplay'
        description: 'Toggle smart autoplay based on your music preferences'
        options:
            enabled:
                name: 'enabled'
                description: 'Enable or disable autoplay'
    language:
        name: 'language'
        description: 'Set language preferences for the bot'
        options:
            scope:
                name: 'scope'
                description: 'Set language for user or server'
                choices:
                    user: 'user'
                    server: 'server'
                    reset: 'reset'
            language:
                name: 'language'
                description: 'Choose your preferred language'
    feedback:
        name: 'feedback'
        description: 'Send feedback to the developers'
    ping:
        name: 'ping'
        description: "Check the bot's latency and connection status"
    help:
        name: 'help'
        description: 'Display all available commands and their descriptions'
        options:
            command:
                name: 'command'
                description: 'Get detailed information about a specific command'
    filter:
        name: 'filter'
        description: 'Apply audio filters to enhance your music experience'
        options:
            type:
                name: 'type'
                description: 'Choose an audio filter to apply'
    chart:
        name: 'chart'
        description: 'Display music analytics and charts'
        options:
            scope:
                name: 'scope'
                description: 'Choose the scope for analytics'
                choices:
                    user: 'Personal'
                    guild: 'Server'
                    global: 'Global'
            limit:
                name: 'limit'
                description: 'Number of top items to display (5-20)'
    lyrics:
        name: 'lyrics'
        description: 'Display lyrics for the currently playing track'
    queue:
        name: 'queue'
        description: 'Display and manage the music queue'

    dj:
        name: 'dj'
        description: 'Manage DJ role for music commands'
        options:
            role:
                name: 'role'
                description: 'The role to set/remove as DJ role (leave empty to create/disable)'

    login:
        name: 'login'
        description: 'Connect your music account to Pepper'
        options:
            account:
                name: 'account'
                description: 'The music service to connect'
                choices:
                    spotify: 'Spotify'
            profile:
                name: 'profile'
                description: 'Your Spotify profile link (Spotify app > Profile > Share > Copy link)'

    logout:
        name: 'logout'
        description: 'Disconnect your music account from Pepper'
        options:
            account:
                name: 'account'
                description: 'The music service to disconnect'
                choices:
                    spotify: 'Spotify'

    volume:
        name: 'volume'
        description: 'Set the music playback volume'
        options:
            volume:
                name: 'volume'
                description: 'Volume level (1-100)'

    playlist:
        name: 'playlist'
        description: 'Create and manage your own playlists'
        subcommands:
            create:
                name: 'create'
                description: 'Create a new playlist'
            delete:
                name: 'delete'
                description: 'Delete one of your playlists'
            rename:
                name: 'rename'
                description: 'Rename one of your playlists'
            list:
                name: 'list'
                description: 'Show all of your playlists'
            view:
                name: 'view'
                description: 'Show the songs in a playlist'
            share:
                name: 'share'
                description: 'Share a playlist code in this channel'
            visibility:
                name: 'visibility'
                description: 'Make a playlist public or private'
            transfer:
                name: 'transfer'
                description: 'Transfer a playlist to another user'
        groups:
            song:
                name: 'song'
                description: 'Manage the songs in a playlist'
                subcommands:
                    add:
                        name: 'add'
                        description: 'Search for a song and add it to a playlist'
                    current:
                        name: 'current'
                        description: 'Add the song that is playing now to a playlist'
                    remove:
                        name: 'remove'
                        description: 'Remove a song from a playlist'
                    move:
                        name: 'move'
                        description: 'Move a song to a different position'
        options:
            playlist:
                name: 'playlist'
                description: 'One of your playlists'
            playlist_or_code:
                name: 'playlist'
                description: 'One of your playlists, or a public share code'
            name:
                name: 'name'
                description: 'Playlist name (up to 50 characters)'
            new_name:
                name: 'name'
                description: 'New playlist name (up to 50 characters)'
            visibility:
                name: 'visibility'
                description: 'Who can play the playlist (default: private)'
            state:
                name: 'state'
                description: 'Public playlists can be played by anyone with the code'
            song:
                name: 'song'
                description: 'Song name or URL to search for'
            position:
                name: 'position'
                description: 'Position of the song to remove'
            from:
                name: 'from'
                description: 'Current position of the song'
            to:
                name: 'to'
                description: 'New position for the song'
            user:
                name: 'user'
                description: 'The user who should become the new owner'
        choices:
            public: 'Public'
            private: 'Private'

