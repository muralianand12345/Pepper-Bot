# Main bot configuration
bot:
    # Discord user IDs with administrative access to the bot
    owners:
        - '1234567890'
    support_server:
        id: '1030400987040600064'
        invite: 'https://discord.gg/XzE9hSbsNb'

    # Bot's presence settings shown in Discord
    presence:
        enabled: true # Whether to display custom status
        status: dnd # Status options: online, idle, dnd (do not disturb), invisible
        interval: 10000 # Rotation interval in milliseconds (10 seconds)
        activity: # Different status messages that will rotate
            - name: 'your Favorite Songs' # Status message text
              type: 'PLAYING' # Activity type
            - name: '<clientname> Radio!' # <clientname> will be replaced with actual bot name
              type: 'LISTENING'
            - name: '<usersize> Users!' # <usersize> will show total users count
              type: 'LISTENING'
            - name: 'version <version>' # <version> will be replaced with bot version
              type: 'PLAYING'
            - name: 'with <guildsize> Servers!' # <guildsize> shows total server count
              type: 'PLAYING'
            - name: '<channelsize> Channels!' # <channelsize> shows total channels
              type: 'WATCHING'
    command:
        cooldown_message: You are on `<duration>` cooldown! # Message shown when command is on cooldown

    # Logging channel configuration
    log:
        command: '1234567890' # Channel ID for command usage logs
        server: '1234567890' # Channel ID for server join/leave logs

# Premium tiers - tier 1 is granted to members of the support server
premium:
    tiers:
        - id: 0
          name: 'Basic'
          feature:
              playlist_limit: 20 # Max tracks queued from one playlist (null = unlimited)
              custom_playlists: 1 # Custom playlists a user can own (/playlist)
              custom_playlist_songs: 10 # Songs allowed per custom playlist
        - id: 1
          name: 'Premium'
          feature:
              playlist_limit: null
              custom_playlists: 5
              custom_playlist_songs: 50

# Music playback configuration
music:
    enabled: true # Whether music functionality is enabled
    cache:
        enabled: true # Whether to enable caching for music data
        max_size: 500 # Maximum number of cached items
        default_search_ttl: 600000 # Default TTL for search results in ms (10 minutes)
        default_url_ttl: 1800000 # Default TTL for URL results in ms (30 minutes)
        cleanup_interval: 300000 # Interval for cleaning up cache in ms (5 minutes)
    # Smart autoplay (/autoplay) - every setting is optional, these are the defaults
    autoplay:
        batch_size: 5 # Songs added each time the queue runs low
        favorites_per_batch: 1 # Of those, familiar songs from the listeners' history
        refill_below: 2 # Add a batch when fewer than this many songs are queued
        history_days: 90 # Only favorites played within this many days count
        early_skip_seconds: 30 # Skipping an autoplay pick before this steers away from it
        seeds: # How many songs of each kind shape the picks
            session: 5 # Songs people requested this session (strongest)
            listeners: 2 # Top songs of people in the voice channel
            server: 1 # This server's top songs, only if they fit the mood
    # Lavalink audio node configuration
    lavalink:
        default_search:
            spsearch # Default platform for searches
            # Options: amsearch, bcsearch, dzsearch, jssearch,
            #          scsearch, spsearch, tdsearch, ytsearch,
            #          vksearch, ytmsearch
        # Audio nodes (servers) for processing music - ordered by priority
        nodes:
            - identifier: 'Pepper 1' # Friendly name for the node
              host: 'lavalink.muralianand.in' # Server hostname/IP
              port: 25773 # Connection port
              password: '4Vzm^mZw2CJG@P7pMM5$' # Authentication password
              nodePriority: 1 # Priority level (lower number = higher priority)
              useSSL: true # Whether to use SSL/TLS
              maxRetryAttempts: 100000 # Number of retry attempts on failure
              retryDelayMs: 10000 # Delay between retries in ms (10 seconds)
              enableSessionResumeOption: true # Enable session resuming
              sessionTimeoutSeconds: 30000 # Session timeout in seconds
              apiRequestTimeoutMs: 10000 # API request timeout in ms (10 seconds)
              isBackup: false # Whether this node is a backup

            # Backup node - used if primary node fails
            - identifier: 'Pepper 2'
              host: 'lavalink.jirayu.net'
              port: 13592
              password: 'youshallnotpass'
              nodePriority: 4
              useSSL: false
              maxRetryAttempts: 100000
              retryDelayMs: 10000
              enableSessionResumeOption: true
              sessionTimeoutSeconds: 30000
              apiRequestTimeoutMs: 10000
              isBackup: true

# AI features - needs OPENAI_API_KEY (and optionally OPENAI_BASE_URL) in .env
ai:
    enabled: true # Off unless set to true
    model: gpt-5.4-mini # gpt-5.4-nano also works well for autoplay and costs less
    reasoning_effort: low # none, minimal, low, medium or high. Set to null for models without reasoning (gpt-4.1, gpt-4o)
    temperature: null # Only for models that accept it
    max_output_tokens: 2000
    timeout_ms: 15000 # Slower answers are dropped and the bot uses its own picks
    daily_limit: 5000 # Requests per day across all servers (resets at midnight UTC)
    autoplay:
        enabled: true # Let the AI choose smart autoplay's picks
        candidates: 25 # How many ranked songs the AI chooses from
        daily_limit_per_guild: 150 # Requests per server per day
